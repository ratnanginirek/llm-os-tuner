[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "llm-os-tuner"
version = "0.1.0"
description = "Safe LLM-guided Linux kernel parameter tuning"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
dependencies = ["PyYAML>=6"]

[project.optional-dependencies]
llm = ["anthropic>=0.40"]
analysis = ["pandas>=2", "matplotlib>=3.7"]
dev = ["pytest>=8", "ruff>=0.5"]

[project.scripts]
ostuner = "ostuner.cli:main"

[tool.setuptools.packages.find]
include = ["ostuner*"]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]

[tool.pytest.ini_options]
testpaths = ["tests"]
